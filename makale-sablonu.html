<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}} | Güzel Hukuk Bürosu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Syne:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../style.css">
    <script src="../main.js"></script>
</head>
</head>
<body>
    <div id="navbar-placeholder"></div>

    <main class="article-container">
        <article class="article-content-wrapper">
            <header class="article-header">
                <div class="article-meta-info">
                    <span class="article-tag">{{TAG}}</span>
                    <span class="article-bullet">•</span>
                    <span class="article-date">{{DATE}}</span>
                </div>
                <h1 class="article-title">{{TITLE}}</h1>
            </header>
            
            <hr class="article-divider">
            
            <div class="article-body">
                {{CONTENT}}
            </div>
        </article>
    </main>

    <div id="footer-placeholder"></div>
</body>
</html>
</body>
</html>
