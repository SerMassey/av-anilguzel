<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>İçerik Yönetim Paneli | Antalya Av. Anıl Güzel</title>
  <!-- Netlify Identity Widget -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
  <!-- Decap CMS Script -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

  <!-- Decap CMS Özel Bileşen Kayıtları -->
  <script>
    // 1. Dinamik ve Genişletilebilir Tablo Bileşeni (Excel Mantığı)
    CMS.registerEditorComponent({
      id: "dynamicTable",
      label: "Dinamik Tablo",
      fields: [
        {
          label: "Tablo Başlıkları (Sütunlar)",
          name: "headers",
          widget: "list",
          fields: [
            { label: "Sütun Adı", name: "col", widget: "string" }
          ],
          default: [{ col: "Özellik / Kriter" }, { col: "Seçenek 1" }, { col: "Seçenek 2" }]
        },
        {
          label: "Tablo Satırları",
          name: "rows",
          widget: "list",
          fields: [
            {
              label: "Satır Hücreleri (Sütun sırasına göre yazın)",
              name: "cells",
              widget: "list",
              fields: [
                { label: "Hücre Değeri", name: "cellValue", widget: "string" }
              ]
            }
          ],
          default: [
            { cells: [{ cellValue: "Örnek Satır 1 - Hücre 1" }, { cellValue: "Hücre 2" }, { cellValue: "Hücre 3" }] },
            { cells: [{ cellValue: "Örnek Satır 2 - Hücre 1" }, { cellValue: "Hücre 2" }, { cellValue: "Hücre 3" }] },
            { cells: [{ cellValue: "Örnek Satır 3 - Hücre 1" }, { cellValue: "Hücre 2" }, { cellValue: "Hücre 3" }] }
          ]
        }
      ],
      pattern: /<div class="article-table-container">[\s\S]*?<\/div>/,
      fromBlock: function(match) {
        return {};
      },
      toBlock: function(obj) {
        const headers = obj.headers || [];
        const rows = obj.rows || [];

        let headerHtml = headers.map(h => `<th>${h.col || ''}</th>`).join('');
        
        let rowsHtml = rows.map(r => {
          let cells = r.cells || [];
          let cellHtml = cells.map(c => `<td>${c.cellValue || ''}</td>`).join('');
          return `<tr>${cellHtml}</tr>`;
        }).join('');

        return `
<div class="article-table-container">
    <table class="article-comparison-table">
        <thead>
            <tr>${headerHtml}</tr>
        </thead>
        <tbody>
            ${rowsHtml}
        </tbody>
    </table>
</div>`;
      },
      toPreview: function(obj) {
        return `<div style="background:#044327; color:#fff; padding:12px; border-radius:8px;">📊 Esnek Tablo (${(obj.rows || []).length} Satır)</div>`;
      }
    });

    // 2. Kaynak Atfı (Dipnot) Bileşeni
    CMS.registerEditorComponent({
      id: "citationSup",
      label: "Kaynak Atfı (Dipnot)",
      fields: [
        { label: "Kaynak Numarası", name: "numara", widget: "string", default: "1" }
      ],
      pattern: /<sup><a href="#kaynak-\d+">.*?<\/a><\/sup>/,
      fromBlock: function(match) {
        return { numara: match[1] || "1" };
      },
      toBlock: function(obj) {
        return `<sup><a href="#kaynak-${obj.numara || '1'}">${obj.numara || '1'}</a></sup>`;
      },
      toPreview: function(obj) {
        return `<span style="color:#10b981; font-weight:bold;">[${obj.numara || '1'}]</span>`;
      }
    });
  </script>
</body>
</html>
