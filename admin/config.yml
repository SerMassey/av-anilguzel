backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "blog"
    label: "Yazılar / Makaleler"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Başlık", name: "title", widget: "string"}
      - {label: "Tarih", name: "date", widget: "datetime"}
      - {label: "Etiket", name: "tag", widget: "select", options: ["Ceza", "Gayrimenkul ve Kira", "İş", "Aile", "Yabancılar", "Miras", "Şirketler", "Ticaret", "Borçlar ve Tazminat", "Sözleşmeler", "İcra ve İflas", "Genel"]}
      - {label: "Makale Özeti", name: "description", widget: "text", hint: "Kartlarda görünecek kısa özeti buraya yazın."}
      - {label: "İçerik", name: "body", widget: "markdown"}

      