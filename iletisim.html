      <div class="container">
        <div class="contact-grid-clean">

                </svg>
              </div>
              <div class="text-thin">
                <h4>Telefon</h4>
                <p><a href="tel:+905357122526">+90 (535) 712 25 26</a></p>
              </div>
            </div>

            <div class="info-row">
              <div class="icon-thin">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">

                </svg>
              </div>
              <div class="text-thin">
                <h4>WhatsApp</h4>
                <p><a href="https://wa.me/905357122526" target="_blank">+90 (535) 712 25 26</a></p>
              </div>
            </div>

            <div class="info-row">
              <div class="icon-thin">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                  <polyline points="22,6 12,13 2,6"></polyline>
                </svg>
              </div>
              <div class="text-thin">
                <h4>E-posta</h4>
                <p><a href="mailto:av.anilguzel@gmail.com">av.anilguzel@gmail.com</a></p>
              </div>
            </div>

            <div class="info-row">
              <div class="icon-thin">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                  <circle cx="12" cy="10" r="3"></circle>
                </svg>
              </div>
              <div class="text-thin">
                <h4>Adres</h4>
                <p>Varlık Mah. 100. Yıl Bulvarı, Onur Apt. No: 102/3<br>Muratpaşa/Antalya</p>
              </div>
            </div>
          </div>

          <!-- SAĞ SÜTUN: Randevu Formu -->
          <div class="contact-form-side">
            <h2>Bize Ulaşın</h2>
            <p class="form-desc">Bilgi almak veya randevu talep etmek için iletişim formumuzu doldurarak bize ulaşabilirsiniz.</p>
            
            <form action="https://formspree.io/f/moeqazrz" method="POST" class="clean-form">
              
              <div class="form-row">
                <input type="text" name="ad" placeholder="Adınız*" required>
                <input type="text" name="soyad" placeholder="Soyadınız*" required>
              </div>

              <div class="form-row">
                <input type="text" inputmode="numeric" pattern="[0-9]*" name="telefon" placeholder="Telefon*" required>
                <input type="email" name="email" placeholder="E-posta*" required>
              </div>

              <div class="form-group-full">
                <select name="konu" required>
                  <option value="" disabled selected>Görüşme Konusu Seçiniz</option>
                  <option value="ceza">Ceza Hukuku</option>
                  <option value="bosanma">Aile & Boşanma Hukuku</option>
                  <option value="gayrimenkul">Gayrimenkul Hukuku</option>
                  <option value="icra">İcra & İflas Hukuku</option>
                  <option value="diger">Diğer/Genel Danışmanlık</option>
                </select>
              </div>

              <textarea name="mesaj" rows="5" placeholder="Mesajınız ve Detaylar *" required></textarea>

              <button type="submit" class="clean-btn">Randevu Talebi Gönder &rarr;</button>
            </form>
          </div>

        </div>

        <!-- HARİTA -->
        <div class="map-container-clean">
          <iframe 
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d10882.893190923147!2d30.676082792351263!3d36.88634619558422!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x14c3903b2ab40073%3A0xb31c78eb6a069197!2zQ2Fua3VydGFyYW4gJiBHw7x6ZWwgQXZ1a2F0bMSxayBCw7xyb3N1!5e1!3m2!1sen!2str!4v1787858456134!5m2!1sen!2str" 
            width="100%" height="320" style="border:0;" allowfullscreen="" loading="lazy">
          </iframe>
        </div>

      </div>
    </section>
  </main>

  <div id="footer-placeholder"></div>

<script src="main.js"></script>

</html>
